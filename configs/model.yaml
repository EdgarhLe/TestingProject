# configs/model.yaml
# Cấu hình kiến trúc mô hình VL-JEPA

x_encoder:
  model_name: "facebook/vjepa2-vitl"   # cập nhật sau khi xác nhận tên chính thức
  frozen: true                           # KHÔNG train X-Encoder
  output_dim: 1024

predictor:
  model_name: "Qwen/Qwen2.5-0.5B"      # hoặc 1.5B
  use_layers: "upper_half"              # tương đương layers 8–16 của Llama-3.2-1B trong paper
  attention_mask: "bidirectional"        # thay causal mask theo thiết kế VL-JEPA
  max_context_tokens: 512
  projection_dim: 1536                   # chiều shared embedding space

y_encoder:
  model_name: "BAAI/bge-m3"
  lr_multiplier: 0.05                    # LR nhỏ hơn để giữ pretrained multilingual capability
  projection_dim: 1536

embedding_dim: 1536                      # shared space dimension (theo paper)
